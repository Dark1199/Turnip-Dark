      - name: Download Mesa Source
        run: |
          set -euo pipefail
          rm -rf mesa-mesa-24.3.4 mesa-24.3.4 mesa-src.zip mesa-src.tar.xz
          ok=0
          if curl -fL --retry 3 --retry-delay 5 -o mesa-src.zip "https://gitlab.freedesktop.org/mesa/mesa/-/archive/mesa-24.3.4/mesa-mesa-24.3.4.zip" && unzip -tq mesa-src.zip >/dev/null 2>&1; then
            unzip -q mesa-src.zip
            ok=1
          elif curl -fL --retry 3 --retry-delay 5 -o mesa-src.tar.xz "https://archive.mesa3d.org/mesa-24.3.4.tar.xz" && tar -tJf mesa-src.tar.xz >/dev/null 2>&1; then
            tar -xJf mesa-src.tar.xz
            mv mesa-24.3.4 mesa-mesa-24.3.4
            ok=1
          fi
          test "$ok" = "1"
          test -d mesa-mesa-24.3.4/src
