name: Build Turnip Dark

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر
  push:
    branches: [ "main" ] # يبدأ التجميع فوراً بمجرد حفظ الملف

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Mesa Source
        run: |
          curl -fL --retry 3 -o mesa-24.3.4.zip \
            https://mesa3d.org
          file mesa-24.3.4.zip | grep -q "Zip archive"
          unzip -q mesa-24.3.4.zip
          ls -d mesa-24.3.4

      - name: Apply Turnip Dark sources
        run: |
          # فك ضغط ملف التعديلات التابع لك المتواجد داخل مجلد src ودمجه
          if [ -f "src/turnip_dark_v1.2_source.zip" ]; then
            cd src
            unzip -q turnip_dark_v1.2_source.zip
            rm turnip_dark_v1.2_source.zip
            cd ..
            rm -rf mesa-24.3.4/src/freedreno
            cp -r src/freedreno mesa-24.3.4/src/freedreno
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-mako python3-yaml \
            glslang-tools bison flex pkg-config zip
          pip install --break-system-packages meson mako

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Create cross file
        run: |
          T=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$T/llvm-ar'
          c = ['$T/aarch64-linux-android29-clang']
          cpp = ['$T/aarch64-linux-android29-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          strip = '$T/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Build
        run: |
          cd mesa-24.3.4
          meson setup build --cross-file ../android-aarch64.txt \
            -Dbuildtype=release -Dplatforms=android -Dplatform-sdk-version=29 \
            -Dandroid-stub=true -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl -Dglx=disabled -Degl=disabled \
            -Dllvm=disabled -Dzstd=disabled
          ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Rename and Pack Driver Zip
        run: |
          # إعادة تسمية الملف وحفظه داخل ملف zip جاهز ومباشر
          cd mesa-24.3.4/build/src/freedreno/vulkan/
          mv libvulkan_freedreno.so vulkan.dark.so
          zip -r ../../../../../vulkan.dark.zip vulkan.dark.so

      - uses: actions/upload-artifact@v4
        with:
          name: Turnip-Dark-v1.2-Ready
          path: vulkan.dark.zip
