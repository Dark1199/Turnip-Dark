name: Build Turnip Dark

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SRC_ZIP: turnip_dark_v0.0.3_C_gmem_source.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify custom source archive
        run: |
          set -euo pipefail
          test -f "src/$SRC_ZIP"
          unzip -tq "src/$SRC_ZIP"

      - name: Download Mesa Source
        run: |
          set -euo pipefail
          rm -rf mesa-mesa-24.3.4 mesa-24.3.4 mesa-src.zip mesa-src.tar.xz
          ok=0
          for url in \
            "https://github.com/mirror/mesa/archive/refs/tags/mesa-24.3.4.zip" \
            "https://gitlab.freedesktop.org/mesa/mesa/-/archive/mesa-24.3.4/mesa-mesa-24.3.4.zip"; do
            rm -f mesa-src.zip
            if curl -fL --retry 3 --retry-delay 5 -o mesa-src.zip "$url" && unzip -tq mesa-src.zip >/dev/null 2>&1; then
              unzip -q mesa-src.zip
              ok=1
              break
            fi
          done
          if [ "$ok" != "1" ]; then
            curl -fL --retry 3 --retry-delay 5 -o mesa-src.tar.xz "https://archive.mesa3d.org/mesa-24.3.4.tar.xz"
            tar -tJf mesa-src.tar.xz >/dev/null
            tar -xJf mesa-src.tar.xz
            mv mesa-24.3.4 mesa-mesa-24.3.4
            ok=1
          fi
          test "$ok" = "1"
          test -d mesa-mesa-24.3.4/src

      - name: Apply Turnip Dark sources
        run: |
          set -euo pipefail
          cd src
          rm -rf freedreno
          unzip -q -o "$SRC_ZIP"
          test -d freedreno
          cd ..
          rm -rf mesa-mesa-24.3.4/src/freedreno
          cp -r src/freedreno mesa-mesa-24.3.4/src/freedreno

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip python3-mako python3-yaml python3-ply glslang-tools bison flex pkg-config zip
          pip install --break-system-packages meson mako pyyaml

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Create cross file
        run: |
          set -euo pipefail
          T=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$T/llvm-ar'
          c = ['$T/aarch64-linux-android29-clang']
          cpp = ['$T/aarch64-linux-android29-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          strip = '$T/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Write build script with auto-fix
        run: |
          cat > build-with-autofix.sh <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          WS="$GITHUB_WORKSPACE"
          LOG="$WS/build.log"
          ERRS="$WS/errors.txt"
          APPLIED="$WS/autofix-applied.txt"
          : > "$LOG"
          : > "$APPLIED"
          mkdir -p "$WS/empty-pkgconfig"
          export PKG_CONFIG_LIBDIR="$WS/empty-pkgconfig"
          export PKG_CONFIG_PATH=""
          cd "$WS/mesa-mesa-24.3.4"
          EXTRA=()
          ATTEMPT=1
          while [ "$ATTEMPT" -le 3 ]; do
            echo "===== build attempt $ATTEMPT =====" | tee -a "$LOG"
            rm -rf build
            if meson setup build --cross-file ../android-aarch64.txt -Dbuildtype=release -Dplatforms=android -Dplatform-sdk-version=29 -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dglx=disabled -Degl=disabled -Dllvm=disabled -Dzstd=disabled -Dwrap_mode=default "${EXTRA[@]}" >> "$LOG" 2>&1 \
              && ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so >> "$LOG" 2>&1 \
              && test -f build/src/freedreno/vulkan/libvulkan_freedreno.so; then
              echo "BUILD OK on attempt $ATTEMPT" | tee -a "$LOG"
              exit 0
            fi
            grep -E "error:|FAILED:|ERROR:|fatal error" "$LOG" | tail -60 > "$ERRS"
            echo "----- captured errors -----"
            cat "$ERRS"
            CHANGED=0
            if grep -qE "undeclared identifier 'str(case)?(str|cmp)'|implicit declaration of function 'str" "$ERRS" && ! printf '%s\n' "${EXTRA[@]}" | grep -q "_GNU_SOURCE"; then
              EXTRA+=("-Dcpp_args=-D_GNU_SOURCE" "-Dc_args=-D_GNU_SOURCE")
              echo "fix: define _GNU_SOURCE" | tee -a "$APPLIED"
              CHANGED=1
            fi
            if grep -qE "\[-Werror" "$ERRS" && ! printf '%s\n' "${EXTRA[@]}" | grep -q "werror=false"; then
              EXTRA+=("-Dwerror=false" "-Dcpp_args=-Wno-error" "-Dc_args=-Wno-error")
              echo "fix: disable warnings-as-errors" | tee -a "$APPLIED"
              CHANGED=1
            fi
            if grep -q "libspirv.h' file not found" "$ERRS"; then
              rm -rf "$WS/empty-pkgconfig"
              mkdir -p "$WS/empty-pkgconfig"
              echo "fix: clear pkg-config search path" | tee -a "$APPLIED"
              CHANGED=1
            fi
            if [ "$CHANGED" = "0" ]; then
              echo "no known automatic fix matches these errors" | tee -a "$APPLIED"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "BUILD FAILED" | tee -a "$LOG"
          exit 1
          EOF
          chmod +x build-with-autofix.sh

      - name: Configure and build
        id: build
        run: ./build-with-autofix.sh

      - name: Error report
        if: always()
        run: |
          {
            echo "### Build result: ${{ steps.build.outcome }}"
            echo "#### Auto-fixes applied"
            cat autofix-applied.txt 2>/dev/null || echo "none"
            echo "#### Last captured errors"
            echo '```'
            cat errors.txt 2>/dev/null || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            errors.txt
            autofix-applied.txt
          if-no-files-found: ignore

      - name: Package
        run: |
          set -euo pipefail
          cp mesa-mesa-24.3.4/build/src/freedreno/vulkan/libvulkan_freedreno.so vulkan.dark.so
          zip vulkan.dark.zip vulkan.dark.so
          unzip -l vulkan.dark.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-dark
          path: vulkan.dark.zip
          if-no-files-found: error
