name: Build Turnip Dark

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify custom source archive
        run: |
          set -euo pipefail
          test -f src/turnip_dark_v1.2_source.zip
          unzip -tq src/turnip_dark_v1.2_source.zip

      - name: Download Mesa Source
        run: |
          set -euo pipefail
          rm -rf mesa-mesa-24.3.4 mesa-24.3.4 mesa-src.zip mesa-src.tar.xz
          ok=0
          for url in \
            "https://github.com" \
            "https://freedesktop.org"; do
            rm -f mesa-src.zip
            if curl -fL --retry 3 --retry-delay 5 -o mesa-src.zip "$url" && unzip -tq mesa-src.zip >/dev/null 2>&1; then
              unzip -q mesa-src.zip
              ok=1
              break
            fi
          done
          if [ "$ok" != "1" ]; then
            curl -fL --retry 3 --retry-delay 5 -o mesa-src.tar.xz "https://mesa3d.org"
            tar -tJf mesa-src.tar.xz >/dev/null
            tar -xJf mesa-src.tar.xz
            mv mesa-24.3.4 mesa-mesa-24.3.4
            ok=1
          fi
          test "$ok" = "1"
          test -d mesa-mesa-24.3.4/src

      - name: Apply Turnip Dark sources & Auto-Fix Code Errors
        run: |
          set -euo pipefail
          cd src
          unzip -q -o turnip_dark_v1.2_source.zip
          test -d freedreno
          cd ..
          
          echo "=== جاري تشغيل أداة الإصلاح التلقائي على ملف tu_cmd_buffer.cc ==="
          # استبدال شامل لكل الأشكال المحتملة للمصفوفات الديناميكية وتحويلها لحجم ثابت
          sed -i 's/struct tu_frag_area raw_areas\[views\]/struct tu_frag_area raw_areas[8]/g' src/freedreno/vulkan/tu_cmd_buffer.cc
          sed -i 's/VkExtent2D frag_areas\[views\]/VkExtent2D frag_areas[8]/g' src/freedreno/vulkan/tu_cmd_buffer.cc
          sed -i 's/VkExtent2D unscaled_frag_areas\[num_views\]/VkExtent2D unscaled_frag_areas[8]/g' src/freedreno/vulkan/tu_cmd_buffer.cc
          
          # خطوة احتياطية لإصلاح أي سياق متبقي في الأسطر القريبة لتجنب تعارض الـ Loops
          sed -i 's/raw_areas\[views\]/raw_areas[8]/g' src/freedreno/vulkan/tu_cmd_buffer.cc
          sed -i 's/frag_areas\[views\]/frag_areas[8]/g' src/freedreno/vulkan/tu_cmd_buffer.cc
          sed -i 's/unscaled_frag_areas\[num_views\]/unscaled_frag_areas[8]/g' src/freedreno/vulkan/tu_cmd_buffer.cc
          echo "=== تم الإصلاح التلقائي بنجاح ==="

          rm -rf mesa-mesa-24.3.4/src/freedreno
          cp -r src/freedreno mesa-mesa-24.3.4/src/freedreno

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip python3-mako python3-yaml python3-ply glslang-tools bison flex pkg-config zip
          pip install --break-system-packages meson mako pyyaml ply

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Create cross file
        run: |
          set -euo pipefail
          T=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$T/llvm-ar'
          c = ['$T/aarch64-linux-android29-clang']
          cpp = ['$T/aarch64-linux-android29-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          strip = '$T/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Configure and build
        run: |
          set -euo pipefail
          mkdir -p "$PWD/empty-pkgconfig"
          export PKG_CONFIG_LIBDIR="$PWD/empty-pkgconfig"
          export PKG_CONFIG_PATH=""
          cd mesa-mesa-24.3.4
          meson setup build --cross-file ../android-aarch64.txt \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=29 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dglx=disabled \
            -Degl=disabled \
            -Dllvm=disabled \
            -Dzstd=disabled \
            -Dwrap_mode=default
          ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so
          test -f build/src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Package
        run: |
          set -euo pipefail
          cp mesa-mesa-24.3.4/build/src/freedreno/vulkan/libvulkan_freedreno.so vulkan.dark.so
          zip vulkan.dark.zip vulkan.dark.so
          unzip -l vulkan.dark.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-dark
          path: vulkan.dark.zip
          if-no-files-found: error
